services:
  postgres:
    image: postgres:17-alpine
    container_name: todoapp-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-todouser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-todopass}
      POSTGRES_DB: ${DATABASE_NAME:-todoapp}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-todouser} -d ${DATABASE_NAME:-todoapp}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todoapp-network

networks:
  todoapp-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
