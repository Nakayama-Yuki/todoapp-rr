services:
  postgres:
    image: postgres:17-alpine
    container_name: todoapp-postgres
    profiles: ["db", "prod"]
    environment:
      POSTGRES_USER: ${DATABASE_USER:-todouser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-todopass}
      POSTGRES_DB: ${DATABASE_NAME:-todoapp}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-todouser} -d ${DATABASE_NAME:-todoapp}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todoapp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todoapp-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://todouser:todopass@postgres:5432/todoapp}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:-todouser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-todopass}
      DATABASE_NAME: ${DATABASE_NAME:-todoapp}
    ports:
      - "3000:3000"
    networks:
      - todoapp-network
    profiles:
      - prod

networks:
  todoapp-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
