name: Node.js CI(pnpm)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildAndTest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ci_user
      PGPASSWORD: ci_password
      PGDATABASE: ci_test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: ci_user
      DATABASE_PASSWORD: ci_password
      DATABASE_NAME: ci_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ci_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@v3
        with:
          version: "12.21.0"
          runtime: node@lts
          cache: true
          require-lockfile: true

      - name: Type and lint checks
        run: pnpm ci:check

      - name: Initialize isolated test database
        run: psql -v ON_ERROR_STOP=1 -f init.sql

      - name: Build production application
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test production application
        run: pnpm test:e2e

      - name: Upload Playwright reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-security-report/
          retention-days: 30
          if-no-files-found: ignore
